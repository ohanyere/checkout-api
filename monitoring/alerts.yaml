apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: checkout-api-alerts
  labels:
    app.kubernetes.io/name: checkout-api
    release: prometheus
spec:
  groups:
    - name: checkout-api.availability
      rules:
        - alert: checkout-apiHighErrorRate
          expr: sum(rate(http_requests_total{service="checkout-api",status=~"5.."}[5m])) / sum(rate(http_requests_total{service="checkout-api"}[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
            team: Platform Engineering
          annotations:
            summary: checkout-api has elevated 5xx responses.
            runbook_url: docs/RUNBOOK.md
        - alert: checkout-apiUnavailable
          expr: up{job="checkout-api"} == 0
          for: 5m
          labels:
            severity: critical
            team: Platform Engineering
          annotations:
            summary: checkout-api is not being scraped or is unavailable.
            runbook_url: docs/RUNBOOK.md
